use_default_settings:
  engines:
    remove:
      - ahmia
      - torch

server:
  bind_address: "0.0.0.0"
  port: 8080
  # The official entrypoint replaces this sentinel with SEARXNG_SECRET.
  secret_key: "ultrasecretkey"
  limiter: false
  public_instance: false

search:
  formats:
    - html
    - json
