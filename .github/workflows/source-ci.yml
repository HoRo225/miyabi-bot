name: source-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: source-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: npm audit --audit-level=high
      - run: docker build --build-arg VCS_REF="$GITHUB_SHA" -t miyabi-bot:ci .

  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/horo225/miyabi-bot
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: npm audit --audit-level=high
      - run: docker build --build-arg VCS_REF="$GITHUB_SHA" -t "$IMAGE:$GITHUB_SHA" .
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: docker push "$IMAGE:$GITHUB_SHA"
      - run: docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
