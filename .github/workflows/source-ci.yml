name: source-ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      BOT_IMAGE: miyabi-bot:git-0000000000000000000000000000000000000000
      DISCORD_TOKEN: test
      DISCORD_CLIENT_ID: test
      DISCORD_GUILD_ID: test
      NINE_ROUTER_JWT_SECRET: test
      NINE_ROUTER_API_KEY_SECRET: test
      NINE_ROUTER_MACHINE_ID_SALT: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: npm audit --audit-level=high
      - run: sh -n ops/deploy.sh ops/deploy.test.sh ops/bootstrap-9router.sh
      - run: sh ops/deploy.test.sh
      - run: docker compose config --quiet
      - run: docker build --build-arg VCS_REF="$GITHUB_SHA" -t miyabi-bot:ci .
